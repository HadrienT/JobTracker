# Local viewer — no collector, no tunnel, nothing public.
#
#   just collect      # on the host: look at every source once, store into ./data/jobtracker.db
#   just up           # this file: the API + the web UI, on http://127.0.0.1:5190
#   just down
#
# Collecting stays a manual, host-side step on purpose: it is the part that talks to the
# internet and that you may want to run, watch and re-run. This stack only *reads* that
# database (plus the favorite/hide flags you set in the UI, which live in the same file).
# For the always-on, self-hosted variant see docker-compose.prod.yml.

name: jobtracker

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The host user, not the image's uid 1001: ./data is a bind mount owned by you, and the
    # API must be able to write there (SQLite WAL files, favorites).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["uvicorn", "jobtracker.api.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      JT_DB_PATH: /data/jobtracker.db
      JT_LOG_LEVEL: INFO
      JT_LOG_FORMAT: json
      JT_API_HOST: 0.0.0.0
      JT_API_PORT: "8100"
      JT_WEB_PORT: "5190"
      JT_PUBLIC_API_BASE: /api
      JT_LLM_ENABLED: "false"
      JT_LLM_BASE_URL: http://127.0.0.1:8000/v1
      JT_LLM_MODEL: none
      JT_LLM_TIMEOUT_S: "5"
      JT_USER_AGENT: JobTracker/0.1
      JT_HTTP_TIMEOUT_S: "5"
      JT_AGGREGATORS_ENABLED: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
    environment:
      JT_PUBLIC_API_BASE: /api
    ports:
      - "127.0.0.1:${JT_WEB_PORT:-5190}:8080"
    restart: unless-stopped
