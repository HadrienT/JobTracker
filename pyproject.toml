[project]
name = "jobtracker"
version = "0.1.0"
description = "Agent de veille sur le marché de l'emploi quant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-ulid>=2.5",
    "zstandard>=0.22",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
aggregators = ["curl_cffi>=0.7"]

[project.scripts]
jobtracker = "jobtracker.runtime.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobtracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]
extend-exclude = ["spikes", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
# N818 : les noms d'exceptions sont normatifs (blueprint/07-ERRORS-AND-LOGGING.md).
# RUF001-003 : typographie française délibérée (× — ’) dans les chaînes et commentaires.
# PLC0415 : imports tardifs délibérés, pour garder les contrats D1→D9 propres.
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    "PLC0415", "N818", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["jobtracker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*", "zstandard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: cascade complète contre le corpus doré (aucun réseau)",
    "contract: collecteurs contre charges utiles figées (aucun réseau)",
    "property: tests hypothesis sur les invariants I1→I3 (aucun réseau)",
    "db: nécessite une base SQLite temporaire",
    "live: appels réels aux sources externes — exclu de la CI",
]
addopts = "-m 'not live' --strict-markers"

[tool.coverage.run]
source = ["jobtracker"]
branch = true

# --- Contrats d'architecture — blueprint/01-ARCHITECTURE.md §2 ---

[tool.importlinter]
root_package = "jobtracker"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "D1 — core ne dépend d'aucun autre package"
type = "forbidden"
source_modules = ["jobtracker.core"]
forbidden_modules = [
    "jobtracker.store", "jobtracker.collect", "jobtracker.normalize",
    "jobtracker.match", "jobtracker.api", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D2 — store n'importe que core"
type = "forbidden"
source_modules = ["jobtracker.store"]
forbidden_modules = [
    "jobtracker.collect", "jobtracker.normalize", "jobtracker.match",
    "jobtracker.api", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D3 — normalize n'importe que core"
type = "forbidden"
source_modules = ["jobtracker.normalize"]
forbidden_modules = [
    "jobtracker.store", "jobtracker.collect", "jobtracker.match",
    "jobtracker.api", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D4 — match n'importe que core et normalize"
type = "forbidden"
source_modules = ["jobtracker.match"]
forbidden_modules = [
    "jobtracker.store", "jobtracker.collect", "jobtracker.api", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D5 — collect n'importe que core"
type = "forbidden"
source_modules = ["jobtracker.collect"]
forbidden_modules = [
    "jobtracker.store", "jobtracker.normalize", "jobtracker.match",
    "jobtracker.api", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D6 — api n'importe que core et store"
type = "forbidden"
source_modules = ["jobtracker.api"]
forbidden_modules = [
    "jobtracker.collect", "jobtracker.normalize", "jobtracker.match", "jobtracker.runtime",
]

[[tool.importlinter.contracts]]
name = "D7 — personne n'importe runtime"
type = "forbidden"
source_modules = [
    "jobtracker.core", "jobtracker.store", "jobtracker.collect",
    "jobtracker.normalize", "jobtracker.match", "jobtracker.api",
]
forbidden_modules = ["jobtracker.runtime"]

# D8 — aucun client HTTP hors collect et match.llm.
# C'est LE contrat qui garde le corpus doré exécutable hors ligne
# (blueprint/01-ARCHITECTURE.md §2). `match.llm` en est l'unique exception
# documentée, d'où l'énumération module par module plutôt que le package entier.
#
# WP05 et WP12 DOIVENT étendre cette liste au fur et à mesure qu'ils créent les
# modules de `match` : profile, rules, score, reasons, prefilter. Tous sauf
# `match.llm`. C'est dans leurs critères d'acceptation.
[[tool.importlinter.contracts]]
name = "D8 — aucun client HTTP hors collect et match.llm"
type = "forbidden"
source_modules = [
    "jobtracker.core", "jobtracker.store", "jobtracker.normalize",
    "jobtracker.match.profile", "jobtracker.match.rules",
    "jobtracker.match.score", "jobtracker.match.reasons",
    "jobtracker.match.prefilter",
]
# `urllib.request` et `http.client` ne sont pas listables ici (import-linter
# refuse les sous-paquets externes) : ils sont couverts par un test de
# discipline dans WP14 §2.1.
forbidden_modules = ["httpx", "curl_cffi", "requests", "aiohttp"]

[[tool.importlinter.contracts]]
name = "D9 — couches"
type = "layers"
layers = [
    "jobtracker.runtime",
    "jobtracker.api",
    "jobtracker.match | jobtracker.normalize | jobtracker.collect | jobtracker.store",
    "jobtracker.core",
]
