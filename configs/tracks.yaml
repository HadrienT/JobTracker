# Tracks — blueprint/wp/WP20-tracks.md.
#
# A track is a second search, shown in its own tab, scored against its own profile. Each entry
# is an *overlay* on configs/profile.yaml: what it does not restate (the LLM lanes, the
# staleness rule, the seniority keywords, the excluded titles) it inherits, so what is written
# here is exactly how the track differs from the quant feed. Mappings merge key by key; a list
# replaces the quant one whole. Bump a track's `version` on any change: it is what tells the
# runtime to rescore that track (runtime/tracks.py).
#
# Names are core.enums.Track values — the API and the tab address a track by that name.

tracks:
  ch_tech:
    # C++, CUDA and machine-learning roles located in Switzerland, at any employer — a
    # bank's Zurich C++ team as much as a robotics start-up's. Junior, like the quant profile.
    version: 2

    scope:
      countries: [CH] # a Swiss location among the posting's locations (remote included)
      exclude_sectors: [] # every employer: the quant feed's exclusion of `tech` does not apply

    # What the track is about: a title keyword (matched on word edges) or a stack tag found in
    # the posting puts it in; neither one → rejected `off_topic`, never silently dropped.
    topic:
      titles:
        [
          "c++",
          "cuda",
          "gpu",
          "hpc",
          "machine learning",
          "ml",
          "mlops",
          "deep learning",
          "computer vision",
          "ai", # "AI Software Engineer", "AI for Investment Research": the score sorts them
          "llm",
          "nlp",
          "perception",
          "robotics",
        ]
      tech: [cpp, cuda, pytorch, tensorflow, jax]

    niche_tech: [cuda, pytorch, tensorflow, jax] # what `tech_niche` rewards on this track

    titles:
      strong:
        [
          "c++",
          "cuda",
          "gpu",
          "machine learning engineer",
          "ml engineer",
          "machine learning scientist",
          "deep learning",
          "computer vision",
          "ai engineer",
          "research engineer",
          "hpc engineer",
          "performance engineer",
          "perception engineer",
        ]
      possible:
        [
          "software engineer",
          "software developer",
          "embedded software",
          "robotics",
          "research scientist",
          "applied scientist",
          "data scientist",
          "machine learning",
          "algorithm",
          "graphics",
          "compiler",
          "simulation",
        ]

    weights:
      sector_tier1: 8 # a registry rank-1 employer (Nvidia, DeepMind, CERN…)
      tech_cpp: 12
      tech_python: 4
      tech_niche: 10
      # An EU national needs a Swiss permit, but it is routine under free movement
      # (blueprint/10-PROFILE-TARGET.md §4): a "right to work" line costs little here.
      visa_sponsors: 4
      visa_no: -5

  tech:
    # The same skills as ch_tech — C++, CUDA, machine learning, and data science one notch below —
    # wherever tech pays well: no low-salary market (Spain, India, Poland…), by request. A Swiss
    # posting shows in both tabs; each track scores it on its own.
    version: 1

    scope:
      countries: [US, CA, GB, IE, CH, DE, AT, NL, LU, DK, SE, NO, SG, HK, JP, AU]
      exclude_sectors: []

    topic:
      titles:
        [
          "c++",
          "cuda",
          "gpu",
          "hpc",
          "low latency",
          "high performance",
          "machine learning",
          "ml",
          "mlops",
          "deep learning",
          "computer vision",
          "ai",
          "llm",
          "nlp",
          "perception",
          "robotics",
          "data scientist",
          "data science",
        ]
      tech: [cpp, cuda, pytorch, tensorflow, jax]

    niche_tech: [cuda, pytorch, tensorflow, jax]

    titles:
      strong:
        [
          "c++",
          "cuda",
          "gpu",
          "machine learning engineer",
          "ml engineer",
          "machine learning scientist",
          "deep learning",
          "computer vision",
          "ai engineer",
          "research engineer",
          "hpc engineer",
          "performance engineer",
          "low latency",
          "perception engineer",
        ]
      possible:
        [
          "software engineer",
          "software developer",
          "embedded software",
          "robotics",
          "research scientist",
          "applied scientist",
          "data scientist",
          "data science",
          "machine learning",
          "algorithm",
          "graphics",
          "compiler",
          "simulation",
        ]

    weights:
      sector_tier1: 8
      tech_cpp: 12
      tech_python: 4
      tech_niche: 10
      # Visa keeps the quant weights: across the US, the UK, Japan or Singapore a "no
      # sponsorship" line does close the door for an EU national.

  paris:
    # Quant finance in France — Paris and its business districts in practice (La Défense,
    # Montrouge, Saint-Quentin-en-Yvelines…): the banks' pricing, model and strats teams, the
    # vendors (Murex, Numerix…), the funds (CFM, QRT, Squarepoint…). Requested 2026-11-03:
    # the maintainer is French, so there is no visa to win and no low-salary market to leave
    # out, and half these postings are written in French. The quant feed's exclusion of
    # `tech` employers is inherited: Mistral or Helsing have nothing to do in this tab.
    version: 1

    scope:
      countries: [FR]

    # A title keyword (English or French, on word edges: "quant" does not match "quantitative")
    # or C++ in the stack puts a posting in. Not "research" alone: the sell side's equity
    # research associates are not quants.
    topic:
      titles:
        [
          "quant",
          "quants",
          "quantitative",
          "quantitatif",
          "quantitative analyst",
          "strat",
          "strats",
          "pricing",
          "valuation",
          "valorisation",
          "xva",
          "cva",
          "derivatives",
          "dérivés",
          "structurer",
          "structuration",
          "trader",
          "trading",
          "front office",
          "front-office",
          "c++",
          "model validation",
          "validation de modèles",
