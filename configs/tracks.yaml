        [
          "quantitative developer",
          "quant developer",
          "quantitative software engineer",
          "quant dev",
          "développeur quant",
          "quantitative analyst",
          "analyste quantitatif",
          "ingénieur marché",
          "ingénieur modèle",
          "pricing",
          "valorisation",
          "xva",
          "strats",
