name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    # gated on tools/gen_openapi.py too: WP09 (this front) has no dependency on WP07
    # (the API), so this job must stay a no-op until WP07 actually ships the generator.
    if: ${{ hashFiles('web/package.json') != '' && hashFiles('tools/gen_openapi.py') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --all-extras
      - run: cd web && npm ci
      - run: uv run python tools/gen_openapi.py web/openapi.json
      - run: cd web && npm run api:types:local
      - name: le schéma généré doit être identique au schéma commité
        run: git diff --exit-code web/openapi.json web/src/api/schema.gen.ts
