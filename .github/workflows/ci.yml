name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras
      - run: uv run ruff check src tests tools
      - run: uv run ruff format --check src tests tools
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('web/package.json') != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    # gated on tools/gen_openapi.py too: WP09 (this front) has no dependency on WP07
    # (the API), so this job must stay a no-op until WP07 actually ships the generator.
    if: ${{ hashFiles('web/package.json') != '' && hashFiles('tools/gen_openapi.py') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --all-extras
      - run: cd web && npm ci
      - run: uv run python tools/gen_openapi.py web/openapi.json
      - run: cd web && npm run api:types:local
      - name: le schéma généré doit être identique au schéma commité
        run: git diff --exit-code web/openapi.json web/src/api/schema.gen.ts

  # The browser journey and the accessibility gate: blocking. Runs the real compose images
  # over a frozen demo database (docker-compose.e2e.yml); no source is ever contacted.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-extras
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: scripts/e2e.sh --grep-invert "density primitives"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  # Pixel baselines are per-platform and depend on the runner's system fonts, which the app
  # uses (`ui-sans-serif, system-ui`). They were recorded on the maintainer's machine, so a
  # red result here can mean "fonts differ", not "the UI regressed": informational until the
  # baselines are regenerated on the runner (`just e2e --update-snapshots`, review, commit).
  e2e-visual:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --all-extras
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: scripts/e2e.sh --grep "density primitives"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diffs
          path: web/test-results/
